apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisrag-api
  namespace: aegisrag
  labels:
    app: aegisrag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisrag-api
  template:
    metadata:
      labels:
        app: aegisrag-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      containers:
        - name: api
          image: aegisrag/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aegisrag-secrets
            - configMapRef:
                name: aegisrag-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: uploads
              mountPath: /tmp/aegisrag_uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aegisrag-api
  namespace: aegisrag
spec:
  selector:
    app: aegisrag-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
