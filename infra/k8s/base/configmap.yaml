apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisrag-config
  namespace: aegisrag
data:
  APP_ENV: "production"
  QDRANT_HOST: "qdrant"
  QDRANT_PORT: "6333"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "aegisrag"
  OLLAMA_BASE_URL: "http://ollama:11434"
  VLLM_BASE_URL: "http://vllm:8080"
  VLLM_ENABLED: "true"
  HYBRID_RETRIEVAL_ENABLED: "true"
  RERANKING_ENABLED: "false"
  CACHE_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  OTEL_ENABLED: "false"
  NEXT_PUBLIC_API_URL: "https://aegisrag.example.com/api/v1"
