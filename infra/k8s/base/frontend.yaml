apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisrag-frontend
  namespace: aegisrag
  labels:
    app: aegisrag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisrag-frontend
  template:
    metadata:
      labels:
        app: aegisrag-frontend
    spec:
      containers:
        - name: frontend
          image: aegisrag/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: aegisrag-config
                  key: NEXT_PUBLIC_API_URL
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aegisrag-frontend
  namespace: aegisrag
spec:
  selector:
    app: aegisrag-frontend
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
