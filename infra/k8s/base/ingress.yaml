apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisrag-ingress
  namespace: aegisrag
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "52m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aegisrag.example.com
      secretName: aegisrag-tls
  rules:
    - host: aegisrag.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: aegisrag-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aegisrag-frontend
                port:
                  number: 80
