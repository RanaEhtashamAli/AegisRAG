global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: aegisrag
    env: production

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: aegisrag-api
    static_configs:
      - targets: ["aegisrag-api:80"]
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: aegisrag-worker
    static_configs:
      - targets: ["aegisrag-worker:9090"]
    scrape_interval: 30s

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics
