version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aegisrag
      POSTGRES_PASSWORD: aegisrag
      POSTGRES_DB: aegisrag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisrag"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AegisRAG
      APP_ENV: local
      API_V1_PREFIX: /api/v1
      SECRET_KEY: local-dev-secret-change-before-any-real-deployment
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aegisrag
      POSTGRES_USER: aegisrag
      POSTGRES_PASSWORD: aegisrag
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: aegisrag_chunks
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      UPLOAD_DIR: /app/uploads
      HYBRID_RETRIEVAL_ENABLED: "true"
      RERANKING_ENABLED: "false"
      # Langfuse (optional — leave blank to disable observability)
      LANGFUSE_SECRET_KEY: ""
      LANGFUSE_PUBLIC_KEY: ""
      LANGFUSE_HOST: "http://langfuse-web:3000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - ../backend/alembic.ini:/app/alembic.ini
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: AegisRAG
      APP_ENV: local
      SECRET_KEY: local-dev-secret-change-before-any-real-deployment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: aegisrag
      POSTGRES_USER: aegisrag
      POSTGRES_PASSWORD: aegisrag
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: aegisrag_chunks
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      UPLOAD_DIR: /app/uploads
    volumes:
      - ../backend/app:/app/app
      - ../backend/alembic:/app/alembic
      - upload_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    command: uv run celery -A app.workers.celery_app.celery_app worker --loglevel=info

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000  # host:port only — lib/api.ts appends /api/v1
    depends_on:
      - backend

  # ── Langfuse observability (optional profile) ─────────────────────────────
  # Start with: docker compose --profile langfuse up
  langfuse-postgres:
    image: postgres:16
    profiles: ["langfuse"]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24
    profiles: ["langfuse"]
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"

  minio:
    image: minio/minio:latest
    profiles: ["langfuse"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  langfuse-web:
    image: langfuse/langfuse:2
    profiles: ["langfuse"]
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: changeme-langfuse-secret
      SALT: changeme-salt
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: langfuse
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      clickhouse:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  qdrant_storage:
  ollama_models:
  upload_data:
  langfuse_postgres_data:
  clickhouse_data:
  minio_data:
